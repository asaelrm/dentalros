<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Crea tu contraseña · DentalRos</title>
  <link rel="stylesheet" href="css/invitation.css">
  <script src="js/activate.js" defer></script>
</head>
<body>
  <main>
    <p>DentalRos · Acceso privado</p>
    <h1>Crea tu contraseña</h1>
    <p>Solo tú conocerás tu contraseña. El enlace vence en 24 horas y se utiliza una sola vez.</p>
    <form id="activate-form">
      <label>Nueva contraseña<input name="password" type="password" minlength="10" maxlength="1024" autocomplete="new-password" required></label>
      <label>Repite la contraseña<input name="confirmation" type="password" minlength="10" maxlength="1024" autocomplete="new-password" required></label>
      <button type="submit">Guardar mi contraseña</button>
    </form>
    <p id="activate-message" role="status" aria-live="polite"></p>
    <a href="./">Ir al inicio de sesión</a>
  </main>
</body>
</html>
